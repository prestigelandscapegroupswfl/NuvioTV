name: Publish verified Shield APK

on:
  push:
    branches: [titanium-x-dev]
    paths: [.github/workflows/publish-verified-shield-preview.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/titanium-x-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN: '45558866553'
      VERIFIED_HEAD: '0ad331c996c6817a4ef35300f0e6d6f6050b746c'
    steps:
      - name: Verify and publish the completed build
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN")"
          jq -e --arg expected "$VERIFIED_HEAD" '
            .status == "completed" and .conclusion == "success" and
            .head_sha == $expected and .head_branch == "titanium-x-dev" and
            .path == ".github/workflows/pr-full-debug-build.yml"
          ' <<< "$run" >/dev/null
          tag="titanium-x-preview-$VERIFIED_RUN"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" \
            --name titanium-x-shield-preview --dir "$RUNNER_TEMP/preview"
          cd "$RUNNER_TEMP/preview/shield-preview"
          grep -Fx "Build run: $VERIFIED_RUN" BUILD.txt
          grep -Fq "package: name='com.titaniumx.tv.debug'" APK-INFO.txt
          grep -Fq "application-label:'Titanium X'" APK-INFO.txt
          grep -Fq arm64-v8a APK-INFO.txt
          sha256sum -c SHA256SUMS.txt
          test -s SIGNATURE.txt
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_HEAD" --title 'Titanium X — Cinematic Shield Preview' \
            --prerelease --latest=false \
            --notes 'Verified Android TV build with the large cinematic hero, featured collection shelves, and 18 built-in animated covers. Uses a per-run test signing key. Back up Titanium X before replacing an older preview. Keep your regular Nuvio installed.' \
            Titanium-X-Shield-Preview.apk SHA256SUMS.txt
